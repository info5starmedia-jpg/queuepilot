# QueuePilot vhost for the shared nginx.
# ⚠ This touches shared nginx (also serves taskpilot + codes-bot).
# Install ONLY per deploy/README.md: `nginx -t` then a graceful reload.
# TLS lines are filled in by certbot:
#   certbot --nginx -d queuepilot.taskpilot.tech

server {
    server_name queuepilot.taskpilot.tech;

    # Engine/app updates are static files the update-client fetches:
    #   /engines.manifest.json  +  /updates/<file>
    # Served straight from disk (never proxied, never through the app),
    # with long cache lifetimes — tarballs are content-addressed by version.
    location /updates/ {
        alias /root/queuepilot-server/data/updates/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        autoindex off;
    }
    location = /engines.manifest.json {
        alias /root/queuepilot-server/data/updates/engines.manifest.json;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # Engine tarballs are ~300 MB; don't cap them low.
    client_max_body_size 512m;
}
